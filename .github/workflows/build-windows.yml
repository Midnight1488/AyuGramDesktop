name: Build AyuGram Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build AyuGram Windows Release
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir "%userprofile%\TBuild\Libraries"
          mkdir "%userprofile%\TBuild\ThirdParty"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%userprofile%\TBuild"
          echo TBUILD=%userprofile%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%userprofile%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: TBuild\tdesktop

      - name: Setup MSYS2
        run: |
          mklink /J "%TBUILD%\ThirdParty\msys64" C:\msys64
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make mingw-w64-x86_64-diffutils mingw-w64-x86_64-gperf mingw-w64-x86_64-nasm mingw-w64-x86_64-perl mingw-w64-x86_64-pkgconf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Prepare Libraries
        run: |
          cd "%TBUILD%\tdesktop"
          call Telegram\build\prepare\win.bat silent qt6

      - name: Configure CMake
        run: |
          cd "%TBUILD%\tdesktop\Telegram"
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram Release
        run: |
          cmake --build "%TBUILD%\tdesktop\out" --config Release --target Telegram

      - name: Package AyuGram Portable
        run: |
          mkdir "%TBUILD%\AyuGram_Portable"
          copy "%TBUILD%\tdesktop\out\Release\AyuGram.exe" "%TBUILD%\AyuGram_Portable\"
          powershell Compress-Archive -Path "%TBUILD%\AyuGram_Portable\*" -DestinationPath "%GITHUB_WORKSPACE%\AyuGram-Windows-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: AyuGram-Windows-x64.zip
