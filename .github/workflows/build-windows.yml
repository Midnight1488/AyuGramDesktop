name: Build AyuGram Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build AyuGram Windows Release
    runs-on: windows-latest

    steps:
      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 32GB
          maximum-size: 48GB
          disk-root: "D:"

      - name: Prepare build environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Libraries"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ThirdParty"
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\ThirdParty\msys64" -Target "C:\msys64"
          Write-Host "Created build directories and linked MSYS2"

      - name: Install MSYS2 Build Tools
        shell: cmd
        run: |
          SET PATH=C:\msys64\usr\bin;C:\msys64\mingw64\bin;%PATH%
          pacman -S --noconfirm --needed diffutils make nasm perl pkgconf mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-perl mingw-w64-x86_64-gperf
          if not exist "C:\msys64\usr\bin\pkg-config.exe" (
              if exist "C:\msys64\mingw64\bin\pkg-config.exe" (
                  copy /Y "C:\msys64\mingw64\bin\pkg-config.exe" "C:\msys64\usr\bin\pkg-config.exe"
              )
          )
          if not exist "C:\msys64\usr\bin\nasm.exe" (
              if exist "C:\msys64\mingw64\bin\nasm.exe" (
                  copy /Y "C:\msys64\mingw64\bin\nasm.exe" "C:\msys64\usr\bin\nasm.exe"
              )
          )

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: tdesktop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Restore Prepared Libraries Cache
        uses: actions/cache/restore@v4
        with:
          path: Libraries/win64
          key: tdesktop-libs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tdesktop-libs-${{ runner.os }}-

      - name: Prepare Libraries
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\tdesktop"
          call Telegram\build\prepare\win.bat silent qt6

      - name: Fix Library Filenames for CMake
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\Libraries" -Filter "libzs.lib" -Recurse | ForEach-Object {
              $dir = $_.DirectoryName
              Copy-Item $_.FullName "$dir\zlibstatic.lib" -Force
              Copy-Item $_.FullName "$dir\zlib.lib" -Force
              Write-Host "Created $dir\zlibstatic.lib and zlib.lib"
          }
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\Libraries" -Filter "libzsd.lib" -Recurse | ForEach-Object {
              $dir = $_.DirectoryName
              Copy-Item $_.FullName "$dir\zlibstaticd.lib" -Force
              Copy-Item $_.FullName "$dir\zlibd.lib" -Force
              Write-Host "Created $dir\zlibstaticd.lib and zlibd.lib"
          }
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\Libraries" -Filter "*minizip*.lib" -Recurse | ForEach-Object {
              $dir = $_.DirectoryName
              Copy-Item $_.FullName "$dir\minizipstatic.lib" -Force -ErrorAction SilentlyContinue
              Copy-Item $_.FullName "$dir\minizip.lib" -Force -ErrorAction SilentlyContinue
              Copy-Item $_.FullName "$dir\libminizips.lib" -Force -ErrorAction SilentlyContinue
          }

      - name: Configure CMake
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\tdesktop\Telegram"
          call configure.bat x64 qt6 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram Release
        shell: cmd
        run: |
          cmake --build "%GITHUB_WORKSPACE%\tdesktop\out" --config Release --target Telegram

      - name: Package AyuGram Portable
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tdesktop\out" -Filter "AyuGram.exe" -Recurse
          if (-not $found) {
              $found = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tdesktop\out" -Filter "Telegram.exe" -Recurse
          }
          if (-not $found) {
              throw "Neither AyuGram.exe nor Telegram.exe was found in out directory!"
          }
          $exePath = $found[0].FullName
          Write-Host "Found executable at: $exePath"
          $pkgDir = "$env:GITHUB_WORKSPACE\AyuGram_Portable"
          New-Item -ItemType Directory -Force -Path $pkgDir
          Copy-Item $exePath -Destination "$pkgDir\AyuGram.exe"
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\tdesktop\out" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination $pkgDir -Force
          }
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\AyuGram-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: AyuGram-Windows-x64.zip
