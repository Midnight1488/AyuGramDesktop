name: Build AyuGram Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build AyuGram Windows Release
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir "%userprofile%\TBuild\Libraries"
          mkdir "%userprofile%\TBuild\ThirdParty"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%userprofile%\TBuild"
          echo TBUILD=%userprofile%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%userprofile%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Link MSYS2
        shell: pwsh
        run: |
          $dest = "$env:TBUILD\ThirdParty\msys64"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Junction -Path $dest -Target "C:\msys64"
          Write-Host "Successfully linked MSYS2 from C:\msys64 to $dest"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: TBuild\tdesktop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Prepare Libraries
        run: |
          cd "%TBUILD%\tdesktop"
          call Telegram\build\prepare\win.bat silent qt6

      - name: Configure CMake
        run: |
          cd "%TBUILD%\tdesktop\Telegram"
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram Release
        run: |
          cmake --build "%TBUILD%\tdesktop\out" --config Release --target Telegram

      - name: Package AyuGram Portable
        shell: pwsh
        run: |
          $outExe = "$env:TBUILD\tdesktop\out\Release\AyuGram.exe"
          if (-not (Test-Path $outExe)) {
              $found = Get-ChildItem -Path "$env:TBUILD\tdesktop\out" -Filter "AyuGram.exe" -Recurse
              if ($found) { $outExe = $found[0].FullName }
          }
          Write-Host "Found executable at: $outExe"
          $pkgDir = "$env:TBUILD\AyuGram_Portable"
          New-Item -ItemType Directory -Force -Path $pkgDir
          Copy-Item $outExe -Destination "$pkgDir\AyuGram.exe"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\AyuGram-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: AyuGram-Windows-x64.zip
