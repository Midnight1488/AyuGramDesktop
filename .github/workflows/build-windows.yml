name: Build AyuGram Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build AyuGram Windows Release
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Cache TBuild Libraries
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-tbuild-${{ hashFiles('Telegram/build/prepare/prepare.py') }}
          restore-keys: |
            ${{ runner.os }}-tbuild-

      - name: Prepare Libraries
        run: |
          call Telegram\build\prepare\win.bat

      - name: Configure CMake
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram Release
        run: |
          cmake --build out --config Release --target Telegram

      - name: Package AyuGram Portable
        run: |
          mkdir AyuGram_Portable
          copy out\Release\AyuGram.exe AyuGram_Portable\
          powershell Compress-Archive -Path AyuGram_Portable\* -DestinationPath AyuGram_Windows_x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: AyuGram_Windows_x64.zip
